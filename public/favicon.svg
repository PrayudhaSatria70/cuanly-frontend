<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Squircle App Icon Background -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF" />
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#E5E7E8" stroke-width="4"/>

  <!-- Teal Cash Bill Peeking from Top -->
  <path d="M42 28C42 24.6863 44.6863 22 48 22H86C89.3137 22 92 24.6863 92 28V34H42V28Z" fill="#1BC4A4" transform="rotate(-5 67 28)"/>

  <!-- Main Dark Navy Wallet Body -->
  <rect x="20" y="32" width="78" height="62" rx="16" fill="#0C2340"/>

  <!-- Right Clasp -->
  <rect x="80" y="54" width="28" height="18" rx="9" fill="#0C2340"/>
  <!-- Clasp White Center Hole -->
  <circle cx="94" cy="63" r="4" fill="#FFFFFF"/>

  <!-- Bottom-Left Circular Segmented Gauge / Dial -->
  <g transform="translate(38, 73)">
    <circle cx="0" cy="0" r="16" fill="#0C2340"/>
    <!-- Teal Radial Segments -->
    <circle cx="0" cy="0" r="13" fill="none" stroke="#1BC4A4" stroke-width="4.5" stroke-dasharray="2.5 1.8" stroke-linecap="butt"/>
    <!-- White Top-Left Accent Arc -->
    <path d="M -13 0 A 13 13 0 0 1 0 -13" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8.5" fill="#0C2340"/>
  </g>
</svg>